name: Auth SDK CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.3, cache: npm }
      - run: npm ci
      - name: Validate Conventional Commits
        shell: bash
        run: |
          FROM="${{ github.event.pull_request.base.sha || github.event.before }}"
          TO="${{ github.event.pull_request.head.sha || github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$FROM" ] || [ "$FROM" = "$ZERO_SHA" ]; then
            git log -1 --format=%B "$TO" | npx --no-install commitlint --config commitlint.config.mjs
          else
            npx --no-install commitlint --config commitlint.config.mjs --from "$FROM" --to "$TO" --verbose
          fi
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run check:auth-logs
      - run: npm run build
      - run: npm audit --omit=dev --omit=optional

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify npm authentication
        run: npm whoami --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create release and publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --no-install semantic-release
