name: Auth SDK CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.3, cache: npm }
      - run: npm ci
      - name: Validate Conventional Commits
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then FROM="${{ github.event.pull_request.base.sha }}"; TO="${{ github.event.pull_request.head.sha }}"; else FROM="${{ github.event.before }}"; TO="${{ github.sha }}"; fi
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then FROM="$(git rev-list --max-parents=0 HEAD)"; fi
          npx --yes --package @commitlint/cli@20 --package @commitlint/config-conventional@20 commitlint --config commitlint.config.mjs --from "$FROM" --to "$TO" --verbose
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --omit=optional

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create release and publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --yes --package semantic-release@25 --package @semantic-release/changelog@6 --package @semantic-release/git@10 --package conventional-changelog-conventionalcommits@9 semantic-release
